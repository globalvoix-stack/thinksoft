[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core"]

[tool.poetry]
name = "thinksoft"
version = "0.1.0"
description = "Thinksoft - Vibe coding platform powered by a multi-agent system"
authors = ["Thinksoft Team"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "engine" },
    { include = "agents" },
    { include = "modes" },
    { include = "memory" },
    { include = "context" },
    { include = "security" },
    { include = "queue" },
    { include = "crawler" },
    { include = "api" },
    { include = "db" },
    { include = "config" },
    { include = "integrations" },
    { include = "registry" },
]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"

# API
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
python-multipart = "^0.0.12"
sse-starlette = "^2.1.0"

# Database
asyncpg = "^0.30.0"
psycopg2-binary = "^2.9.10"

# AI Models
anthropic = "^0.40.0"
google-generativeai = "^0.8.0"
openai = "^1.55.0"

# Crawling
firecrawl-py = "^1.0.0"

# Embeddings
voyageai = "^0.3.0"

# Security
semgrep = "^1.90.0"

# Auth
python-jose = {extras = ["cryptography"], version = "^3.3"}
passlib = {extras = ["bcrypt"], version = "^1.7"}

# External integrations
exa-py = "^1.0.0"
sentry-sdk = {extras = ["fastapi"], version = "^2.0"}
resend = "^2.0"

# Utilities
python-dotenv = "^1.0.0"
pydantic = "^2.10.0"
pydantic-settings = "^2.6.0"
httpx = "^0.28.0"
tenacity = "^9.0.0"
structlog = "^24.4.0"
python-dateutil = "^2.9.0"
numpy = "^2.0.0"

# Engine core dependencies (required by engine/openhands/ runtime)
jinja2 = "^3.1.6"
docker = ">=7.0.0"
kubernetes = "^33.1.0"
pyyaml = "^6.0.2"
anyio = ">=4.0.0"
aiohttp = ">=3.9.0"
psutil = ">=5.9.0"
libtmux = ">=0.46.2"
pexpect = ">=4.8.0"
bashlex = "^0.18"
dirhash = ">=0.2.0"
pathspec = "^0.12.1"
openhands-aci = "^0.3.2"
fastmcp = "^2.12.4"
python-frontmatter = "^1.1.0"
whatthepatch = "^1.0.6"
termcolor = "*"
json-repair = ">=0.25.0"
python-json-logger = "^3.2.1"
toml = ">=0.10.2"
requests = "^2.32.5"
deprecated = ">=1.2.0"
html2text = ">=2024.0"
python-docx = ">=1.1.0"
python-pptx = ">=1.0.0"
pypdf = "^6.0.0"
pylatexenc = ">=2.10"
tornado = ">=6.5"
browsergym-core = "^0.13.3"
playwright = "^1.55.0"
protobuf = "^5.0.0"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
ruff = ">=0.8.0"
mypy = ">=1.10.0"

[tool.ruff]
lint.select = ["E", "F", "I"]
lint.ignore = ["E501"]
